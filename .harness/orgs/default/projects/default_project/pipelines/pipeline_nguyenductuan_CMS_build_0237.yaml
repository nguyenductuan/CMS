pipeline:
  id: pipeline_nguyenductuan_CMS_build_0237
  name: pipeline_nguyenductuan_CMS_build_0237
  description: Build and test the CMS project with Maven on Java 17.
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      build-intelligence:
        enabled: true
      steps:
        - name: Build and Test
          id: build_and_test_step
          run:
            shell: bash
            script: |-
              # Locate an installed JDK 17
              JDK17_HOME=""
              for d in /usr/lib/jvm/*17* /opt/java/*17* /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17*/x64; do
                if [ -x "$d/bin/java" ]; then
                  JDK17_HOME="$d"
                  break
                fi
              done

              # Fall back to downloading Temurin 17 when none is installed
              if [ -z "$JDK17_HOME" ]; then
                echo "JDK 17 not found on runner, downloading Temurin 17"
                mkdir -p /tmp/jdk17
                curl -fsSL "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse" -o /tmp/jdk17.tar.gz
                tar -xzf /tmp/jdk17.tar.gz -C /tmp/jdk17 --strip-components=1
                JDK17_HOME=/tmp/jdk17
              fi

              export JAVA_HOME="$JDK17_HOME"
              export PATH="$JAVA_HOME/bin:$PATH"

              # Verify Java version
              echo "JAVA_HOME=$JAVA_HOME"
              java -version

              # Make Maven wrapper executable
              chmod +x ./mvnw

              # Run tests
              ./mvnw test -DfailIfNoTests=false
            report:
              type: junit
              paths:
                - "**/target/surefire-reports/*.xml"
  tags:
    onboarding: "true"
