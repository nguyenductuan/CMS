spring:
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/qldacntt"
    username: "root"
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

security:
  jwt:
    # Set JWT_SECRET in environment; use a random secret with at least 32 bytes.
    secret: ${JWT_SECRET:}
    expiration-seconds: 3600

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:sql/**/*.xml


# Enable only in local/dev environments; mock shipments are stored in memory.
viettel:
  mock:
    enabled: ${VIETTEL_MOCK_ENABLED:true}
    base-url: ${VIETTEL_MOCK_BASE_URL:http://localhost:8080}
